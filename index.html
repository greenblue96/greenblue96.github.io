/* ---------- Rendering ---------- */
const $ = (sel) => document.querySelector(sel);

function render(lang) {
  const t = I18N[lang];
  $("#name-en").hidden = lang === "en";

  // static text nodes
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    const val = key.split(".").reduce((o, k) => (o ? o[k] : ""), t);
    if (val) el.textContent = val;
  });

  // nav
  const nav = $("#nav");
  nav.innerHTML = "";
  const navOrder = ["about","education","activities","research","projects","pubs","teaching","skills","contact"];
  navOrder.forEach((k) => {
    const a = document.createElement("a");
    a.className = "nav-link";
    a.href = "#" + (k === "pubs" ? "publications" : k);
    a.textContent = t.nav[k];
    nav.appendChild(a);
  });

  // about
  $("#about-body").innerHTML = t.about.paras.map((p) => `<p>${p}</p>`).join("");

  // research
  $("#research-list").innerHTML = t.research.items.map((i) => `<span class="chip">${i}</span>`).join("");

  // projects
  $("#projects-list").innerHTML = t.projects.list.map((p) => `
    <div class="card">
      <div class="card-top"><h3>${p.title}</h3><span class="meta">${p.period}</span></div>
      ${p.org ? `<div class="org">${p.org}</div>` : ""}
      <p>${p.desc}</p>
      ${(p.tags && p.tags.length) ? `<div class="tags">${p.tags.map((tg) => `<span class="tag">${tg}</span>`).join("")}</div>` : ""}
      ${p.link ? `<a class="link" href="${p.link}" target="_blank" rel="noopener">${lang === "zh" ? "了解更多" : "Learn more"} ↗</a>` : ""}
    </div>`).join("");

  // publications
  $("#pubs-list").innerHTML = t.pubs.list.map((p) => {
    const tagCls = p.tag ? "pub-tag tag-" + p.tag.charAt(1).toLowerCase() : "";
    return `
    <div class="card">
      <div class="card-top"><h3>${p.tag ? `<span class="${tagCls}">${p.tag}</span>` : ""}${p.title}</h3></div>
      ${p.meta ? `<p class="citation">${p.meta}</p>` : ""}
      ${p.link ? `<a class="link" href="${p.link}" target="_blank" rel="noopener">DOI ↗</a>` : ""}
    </div>`;
  }).join("");

  // teaching
  $("#teaching-list").innerHTML = t.teaching.list.map((c) => `
    <div class="card">
      <div class="card-top"><h3>${c.title}</h3><span class="meta">${c.meta}</span></div>
      ${c.org ? `<div class="org">${c.org}</div>` : ""}
      ${c.desc ? `<p>${c.desc}</p>` : ""}
    </div>`).join("");

  // skills
  $("#skills-list").innerHTML = t.skills.groups.map((g) => `
    <div class="skill-group"><h3>${g.name}</h3>
      <div class="chips">${g.items.map((i) => `<span class="chip">${i}</span>`).join("")}</div>
    </div>`).join("");

  // education
  $("#education-list").innerHTML = t.education.list.map((e) => `
    <div class="card">
      <div class="card-top"><h3>${e.title}</h3><span class="meta">${e.meta}</span></div>
      ${e.org ? `<div class="org">${e.org}</div>` : ""}
      ${e.desc ? `<p>${e.desc}</p>` : ""}
    </div>`).join("");

  // professional activities
  $("#activities-list").innerHTML = t.activities.list.map((a) => `
    <div class="card">
      <div class="card-top"><h3>${a.title}</h3><span class="meta">${a.meta}</span></div>
      ${a.org ? `<div class="org">${a.org}</div>` : ""}
      ${a.desc ? `<p>${a.desc}</p>` : ""}
    </div>`).join("");

  // contact
  $("#contact-list").innerHTML = t.contact.items.map((c) => {
    const inner = `<span class="ico">${c.ico}</span><div><div class="lbl">${c.lbl}</div><div class="val">${c.val}</div></div>`;
    return c.href ? `<a class="contact-item" href="${c.href}" target="_blank" rel="noopener">${inner}</a>` : `<div class="contact-item">${inner}</div>`;
  }).join("");

  // lang toggle active state
  document.querySelectorAll(".lang-toggle button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });

  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
}

function switchLang(lang) {
  localStorage.setItem("site-lang", lang);
  render(lang);
}

document.querySelectorAll(".lang-toggle button").forEach((b) => {
  b.addEventListener("click", () => switchLang(b.dataset.lang));
});

// init
const saved = localStorage.getItem("site-lang");
const initial = saved || (navigator.language && navigator.language.startsWith("zh") ? "zh" : "en");
render(initial);
</script>
